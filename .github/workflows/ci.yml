name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks on the commit it releases.
  workflow_call:

permissions:
  contents: read

env:
  # Exact tool versions, so identical commits build identically.
  GO_VERSION: "1.27.3"
  GORELEASER_VERSION: "v2.20.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install age (for the end-to-end test)
        run: go install filippo.io/age/cmd/...@v1.3.2
      - name: Check formatting and modules
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
      - run: go vet ./...
      - name: Test
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
